tg_applications", "sourceSchema": "datamart", "targetSchema": "datastaging", "sourceTableId": "tbl_datamart_fct_credit_scoring", "targetTableId": "tbl_datastaging_stg_applications", "sourceFieldId": "f_datamart_fct_credit_scoring_application_id", "targetFieldId": "f_datastaging_stg_applications_application_id", "sourceCardinality": "many", "targetCardinality": "one", "createdAt": 1730246400000}], "config": {"id": 1, "defaultDiagramId": "bank_raya_main_diagram"}, "diagram_filters": {"diagramId": "bank_raya_main_diagram", "tableIds": ["tbl_channel_loan_disbursements", "tbl_datamart_fct_credit_scoring", "tbl_datamart_rpt_slik_ojk", "tbl_dataraw_raw_applications", "tbl_datastaging_stg_applications", "tbl_legacy_collateral_registers", "tbl_scoring_credit_applications", "tbl_scoring_fraud_audit_events", "tbl_scoring_risk_blacklist", "tbl_scoring_scorecard_rules"], "schemasIds": ["channel", "datamart", "dataraw", "datastaging", "legacy", "scoring"]}, "sql_ddl": "-- ==============================================================================\n-- Bank Raya - ChartDB Unified Multi-Platform ERD Import DDL\n-- Architecture: DAMA-DMBOK V.2 Integrated Data Architecture\n-- Target: ChartDB Stateless Diagramming Engine (:8080)\n-- Zero-Credential-Exposure: Sanitized Schema Definitions\n-- ==============================================================================\n\nCREATE SCHEMA IF NOT EXISTS channel;\nCREATE SCHEMA IF NOT EXISTS datamart;\nCREATE SCHEMA IF NOT EXISTS dataraw;\nCREATE SCHEMA IF NOT EXISTS datastaging;\nCREATE SCHEMA IF NOT EXISTS legacy;\nCREATE SCHEMA IF NOT EXISTS scoring;\n\n-- ------------------------------------------------------------------------------\n-- Platform: Google BigQuery (OLAP Data Lakehouse - Mart)\n-- Table: datamart.rpt_slik_ojk\n-- ------------------------------------------------------------------------------\nCREATE TABLE datamart.rpt_slik_ojk (\n    report_id VARCHAR(255) NOT NULL,\n    period_yyyymm VARCHAR(255) NOT NULL,\n    account_number VARCHAR(255) NOT NULL,\n    customer_cif VARCHAR(255) NOT NULL,\n    collectibility_status VARCHAR(255) NOT NULL,\n    outstanding_balance NUMERIC NOT NULL,\n    provision_amount NUMERIC NOT NULL,\n    submission_status VARCHAR(255) NULL DEFAULT 'PENDING',\n    created_at TIMESTAMP NULL DEFAULT CURRENT_TIMESTAMP(),\n    CONSTRAINT pk_rpt_slik_ojk PRIMARY KEY (report_id)\n);\n\nCOMMENT ON TABLE datamart.rpt_slik_ojk IS 'Tabel data mart pelaporan berkala bulanan debitur ke regulator SLIK OJK | DASG: domain_05/subdomain_05_1 | dbt Model: Data Mart Pelaporan Kepatuhan Regulator SLIK OJK Bulanan [Airflow Orchestrated: DAG dags_raya_credit_risk_pipeline @daily] [Superset Metrics: total_outstanding (SUM(outstanding_balance)): Total baki debet pinjaman aktif seluruh debitur; npl_ratio (SUM(CASE WHEN collectibility_status IN (''3'',''4'',''5'') THEN outstanding_balance ELSE 0 END) / NULLIF(SUM(outstanding_balance), 0) * 100): Persentase rasio kredit macet/bermasalah (NPL) Bank Raya]';\nCOMMENT ON COLUMN datamart.rpt_slik_ojk.report_id IS 'Primary key baris pelaporan bulanan SLIK OJK';\nCOMMENT ON COLUMN datamart.rpt_slik_ojk.period_yyyymm IS 'Periode akuntansi pelaporan format tahun-bulan (YYYYMM)';\nCOMMENT ON COLUMN datamart.rpt_slik_ojk.account_number IS 'Nomor rekening fasilitas kredit debitur';\nCOMMENT ON COLUMN datamart.rpt_slik_ojk.customer_cif IS 'Nomor CIF nasabah debitur';\nCOMMENT ON COLUMN datamart.rpt_slik_ojk.collectibility_status IS 'Kolektibilitas debitur per POJK (1: Lancar, 2: DPK, 3: Kurang Lancar, 4: Diragukan, 5: Macet)';\nCOMMENT ON COLUMN datamart.rpt_slik_ojk.outstanding_balance IS 'Total saldo pokok pinjaman aktif';\nCOMMENT ON COLUMN datamart.rpt_slik_ojk.provision_amount IS 'Cadangan Kerugian Penurunan Nilai (CKPN)';\nCOMMENT ON COLUMN datamart.rpt_slik_ojk.submission_status IS 'Status pelaporan ke OJK (PENDING, SUBMITTED, APPROVED)';\nCOMMENT ON COLUMN datamart.rpt_slik_ojk.created_at IS 'Waktu pembentukan data agregasi';\n\n-- ------------------------------------------------------------------------------\n-- Platform: Google BigQuery (OLAP Data Lakehouse - Raw)\n-- Table: dataraw.raw_applications\n-- ------------------------------------------------------------------------------\nCREATE TABLE dataraw.raw_applications (\n    raw_id VARCHAR(255) NOT NULL,\n    payload_json VARCHAR(255) NULL,\n    source_system VARCHAR(255) NOT NULL,\n    kafka_offset BIGINT NULL,\n    ingested_at TIMESTAMP NULL DEFAULT CURRENT_TIMESTAMP(),\n    CONSTRAINT pk_raw_applications PRIMARY KEY (raw_id)\n);\n\nCOMMENT ON TABLE dataraw.raw_applications IS 'Penyimpanan data mentah pengajuan kredit dari CDC message broker | DASG: domain_06/subdomain_06_1 | dbt Source: Data mentah payload pengajuan kredit CDC message broker';\nCOMMENT ON COLUMN dataraw.raw_applications.raw_id IS 'Surrogate identifier mentah ingestion data';\nCOMMENT ON COLUMN dataraw.raw_applications.payload_json IS 'JSON string representasi event transaksi pengajuan kredit';\nCOMMENT ON COLUMN dataraw.raw_applications.source_system IS 'Nama sistem pengirim transaksi (misal: OLTP_CORE_POSTGRES)';\nCOMMENT ON COLUMN dataraw.raw_applications.kafka_offset IS 'Offset Kafka message partition';\nCOMMENT ON COLUMN dataraw.raw_applications.ingested_at IS 'Waktu ingestion ke BigQuery';\n\n-- ------------------------------------------------------------------------------\n-- Platform: Microsoft SQL Server (Legacy Core OLTP)\n-- Table: legacy.collateral_registers\n-- ------------------------------------------------------------------------------\nCREATE TABLE legacy.collateral_registers (\n    collateral_id INT NOT NULL,\n    customer_cif VARCHAR(20) NOT NULL,\n    collateral_type VARCHAR(50) NOT NULL,\n    certificate_number VARCHAR(100) NOT NULL,\n    owner_name VARCHAR(150) NOT NULL,\n    appraisal_value DECIMAL(18,2) NOT NULL,\n    liquidation_value DECIMAL(18,2) NOT NULL,\n    custody_branch_code VARCHAR(10) NOT NULL,\n    is_verified BOOLEAN NOT NULL DEFAULT 1,\n    regi ications.requested_amount IS 'Nominal pinjaman yang diajukan dalam IDR';\nCOMMENT ON COLUMN scoring.credit_applications.tenor_months IS 'Jangka waktu pinjaman dalam bulan | Field tenor_months pada scoring.credit_applications';\nCOMMENT ON COLUMN scoring.credit_applications.risk_tier IS 'Klasifikasi profil risiko (TIER_1 s.d TIER_5)';\nCOMMENT ON COLUMN scoring.credit_applications.score_value IS 'Nilai skor kredit hasil evaluasi engine';\nCOMMENT ON COLUMN scoring.credit_applications.monthly_income IS 'Estimasi penghasilan bulanan nasabah pemohon kredit';\nCOMMENT ON COLUMN scoring.credit_applications.application_status IS 'Status lifecycle pengajuan: IN_REVIEW, APPROVED, REJECTED, DISBURSED';\nCOMMENT ON COLUMN scoring.credit_applications.submitted_at IS 'Waktu pengajuan diajukan | Field submitted_at pada scoring.credit_applications';\nCOMMENT ON COLUMN scoring.credit_applications.approved_at IS 'Waktu persetujuan pinjaman | Field approved_at pada scoring.credit_applications';\n\n-- ------------------------------------------------------------------------------\n-- Platform: MySQL 8.0 / MariaDB (Channel OLTP)\n-- Table: channel.loan_disbursements\n-- ------------------------------------------------------------------------------\nCREATE TABLE channel.loan_disbursements (\n    disbursement_id BIGINT NOT NULL,\n    application_id VARCHAR(36) NOT NULL,\n    partner_channel_code VARCHAR(50) NOT NULL,\n    account_destination VARCHAR(30) NOT NULL,\n    disbursement_amount DECIMAL(18,2) NOT NULL,\n    disbursement_fee DECIMAL(10,2) NOT NULL DEFAULT 0.00,\n    disbursement_status VARCHAR(20) NOT NULL DEFAULT 'PENDING',\n    channel_reference_id VARCHAR(100) NOT NULL,\n    disbursed_at TIMESTAMP NULL DEFAULT CURRENT_TIMESTAMP,\n    CONSTRAINT pk_loan_disbursements PRIMARY KEY (disbursement_id)\n);\n\nCOMMENT ON TABLE channel.loan_disbursements IS 'Transaksi real-time pencairan pinjaman melalui mitra channel digital Bank Raya | DASG: domain_03/subdomain_03_1 | dbt Source: Tran MN scoring.fraud_audit_events.application_id IS 'Foreign key referensi ke scoring.credit_applications';\nCOMMENT ON COLUMN scoring.fraud_audit_events.fraud_risk_score IS 'Skor risiko kecurangan hasil kalkulasi model anomali';\nCOMMENT ON COLUMN scoring.fraud_audit_events.detection_rule IS 'Aturan atau model deteksi yang menandai event';\nCOMMENT ON COLUMN scoring.fraud_audit_events.flagged_at IS 'Waktu deteksi event anomali kecurangan dicatat';\n\n-- ==============================================================================\n-- Cross-Platform Foreign Key & Lineage Relationships\n-- ==============================================================================\nALTER TABLE scoring.credit_applications ADD CONSTRAINT fk_credit_app_scorecard FOREIGN KEY (rule_id) REFERENCES scoring.scorecard_rules(rule_id);\nALTER TABLE scoring.fraud_audit_events ADD CONSTRAINT fk_fraud_audit_events_application_id FOREIGN KEY (application_id) REFERENCES scoring.credit_applications(application_id);\nALTER TABLE channel.loan_disbursements ADD CONSTRAINT fk_disbursement_scoring_app FOREIGN KEY (application_id) REFERENCES scoring.credit_applications(application_id);\nALTER TABLE datastaging.stg_applications ADD CONSTRAINT fk_stg_raw_applications FOREIGN KEY (application_id) REFERENCES dataraw.raw_applications(raw_id);\nALTER TABLE datamart.fct_credit_scoring ADD CONSTRAINT fk_fct_stg_applications FOREIGN KEY (application_id) REFERENCES datastaging.stg_applications(application_id);\n\n-- End of ChartDB Unified Import SQL\n"};
        const TARGET_DIAGRAM_ID = "bank_raya_main_diagram";

        const STORES_SPEC = {
            diagrams: "++id, name, databaseType, databaseEdition, createdAt, updatedAt",
            db_tables: "++id, diagramId, name, schema, x, y, fields, indexes, color, createdAt, width, comment, isView, isMaterializedView, order",
            db_relationships: "++id, diagramId, name, sourceSchema, sourceTableId, targetSchema, targetTableId, sourceFieldId, targetFieldId, type, createdAt",
            db_dependencies: "++id, diagramId, schema, tableId, dependentSchema, dependentTableId, createdAt",
            areas: "++id, diagramId, name, x, y, width, height, color",
            db_custom_types: "++id, diagramId, schema, type, kind, values, fields",
            config: "++id, defaultDiagramId",
            diagram_filters: "diagramId, tableIds, schemasIds",
            notes: "++id, diagramId, content, x, y, width, height, color"
        };

        function log(msg) {
            const box = document.getElementById("status-box");
            const div = document.createElement("div");
            div.className = "status-line";
            div.textContent = msg;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;

        function checkFingerprint(db) {
            for (const name of Object.keys(STORES_SPEC)) {
                if (!db.objectStoreNames.contains(name)) return false;
            }
            try {
                const tx = db.transaction(["db_tables", "diagram_filters"], "readonly");
                const tableStore = tx.objectStore("db_tables");
                if (!tableStore.indexNames.contains("order")) return false;
                const filterStore = tx.objectStore("diagram_filters");
                if (filterStore.keyPath !== "diagramId") return false;
            } catch (e) {
                return false;
            }
            return true;
        }

        function createStores(db) {
            for (const [storeName, specStr] of Object.entries(STORES_SPEC)) {
                const tokens = specStr.split(",").map(t => t.trim()).filter(Boolean);
                const pkToken = tokens[0];
                const autoIncrement = pkToken.startsWith("++");
                const keyPath = autoIncrement ? pkToken.substring(2) : pkToken;
                const indexTokens = tokens.slice(1);

                let store;
                if (!db.objectStoreNames.contains(storeName)) {
                    store = db.createObjectStore(storeName, { keyPath, autoIncrement });
                } else {
                    continue;
                }
                for (const idx of indexTokens) {
                    if (!store.indexNames.contains(idx)) {
                        store.createIndex(idx, idx, { unique: false });
                    }
                }
            }
        }

        async function backupNonRayaData(db) {
            return new Promise((resolve) => {
                try {
                    const storeNames = Array.from(db.objectStoreNames);
                    const tx = db.transaction(storeNames, "readonly");
                    const backup = {};
                    let pending = storeNames.length;
                    if (pending === 0) return resolve({});
                    for (const name of storeNames) {
                        const req = tx.objectStore(name).getAll();
                        req.onsuccess = () => {
                            backup[name] = (req.result || []).filter(item => {
                                if (name === "diagrams") return item.id !== TARGET_DIAGRAM_ID && item.id !== 1 && item.id !== "1";
                                if (name === "db_tables" || name === "db_relationships") return item.diagramId !== TARGET_DIAGRAM_ID && item.diagramId !== 1 && item.diagramId !== "1";
                                if (name === "diagram_filters") return item.diagramId !== TARGET_DIAGRAM_ID;
                                return true;
                            });
                            pending--;
                            if (pending === 0) resolve(backup);
                        };
                        req.onerror = () => {
                            pending--;
                            if (pending === 0) resolve(backup);
                        };
                    }
                } catch (e) {
                    resolve({});
                }
            });
        }

        async function restoreBackupData(db, backup) {
            if (!backup || Object.keys(backup).length === 0) return;
            const names = Object.keys(backup).filter(n => db.objectStoreNames.contains(n) && backup[n].length > 0);
            if (names.length === 0) return;
            return new Promise((resolve) => {
                const tx = db.transaction(names, "readwrite");
                for (const n of names) {
                    const s = tx.objectStore(n);
                    for (const item of backup[n]) {
                        s.put(item);
                    }
                }
                tx.oncomplete = () => resolve();
                tx.onerror = () => resolve();
            });
        }

        async function repairAndReseed() {
            log("🔧 Memulai proses perbaikan & rekonsiliasi skema IndexedDB...");
            document.getElementById("spinner").style.display = "block";
            document.getElementById("repair-btn").style.display = "none";
            document.getElementById("open-btn").style.display = "none";

            // Backup existing non-seed data if possible
            let backup = {};
            try {
                const openReq = indexedDB.open("ChartDB");
                await new Promise((res) => {
                    openReq.onsuccess = async (e) => {
                        const db = e.target.result;
                        backup = await backupNonRayaData(db);
                        db.close();
                        res();
                    };
                    openReq.onerror = () => res();
                });
            } catch (e) {}

            log("🗑️ Menghapus database lama dengan skema tidak kompatibel...");
            const delReq = indexedDB.deleteDatabase("ChartDB");
            delReq.onblocked = function() {
                log("⚠️ Database terblokir oleh tab ChartDB lain. Menutup koneksi...");
            };
            delReq.onerror = function(err) {
                log("❌ Gagal mereset database: " + err);
                document.getElementById("spinner").style.display = "none";
                document.getElementById("repair-btn").style.display = "inline-block";
            };
            delReq.onsuccess = function() {
                log("✨ Database lama berhasil dibersihkan. Menginisialisasi skema baru...");
                seedChartDB(true, backup);
            };
        }

        async function seedChartDB(forceWrite = false, backup = null) {
            try {
                log("📦 Menyalin DDL SQL ke Clipboard sistem...");
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(PAYLOAD.sql_ddl).catch(() => {});
                }

                log("💾 Menginisialisasi Dexie IndexedDB (v130)...");
                const req = indexedDB.open("ChartDB", 130);

                req.onblocked = function(e) {
                    log("⚠️ Database terblokir! Tutup tab ChartDB lain lalu muat ulang halaman ini.");
                    document.getElementById("title").textContent = "Database Terblokir";
                    document.getElementById("sub").textContent = "Tutup tab ChartDB lain yang sedang terbuka, lalu muat ulang halaman ini.";
                    document.getElementById("spinner").style.display = "none";
                    document.getElementById("open-btn").style.display = "inline-block";
                };

                req.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    createStores(db);
                };

                req.onsuccess = async function(e) {
                    const db = e.target.result;

                    // Validasi kompatibilitas skema
                    if (!forceWrite && !checkFingerprint(db)) {
                        db.close();
                        log("⚠️ Struktur database IndexedDB lama tidak kompatibel (skema beracun).");
                        document.getElementById("title").textContent = "Perlu Perbaikan Skema";
                        document.getElementById("sub").textContent = "Ditemukan struktur database lama yang tidak sesuai standar ChartDB v130. Silakan klik tombol di bawah untuk menyinkronkan skema.";
                        document.getElementById("spinner").style.display = "none";
                        document.getElementById("repair-btn").style.display = "inline-block";
                        return;
                    }

                    if (backup) {
                        await restoreBackupData(db, backup);
                    }

                    const tx = db.transaction(["diagrams", "db_tables", "db_relationships", "config", "diagram_filters"], "readwrite");
                    const diagStore = tx.objectStore("diagrams");
                    const tableStore = tx.objectStore("db_tables");
                    const relStore = tx.objectStore("db_relationships");
                    const confStore = tx.objectStore("config");
                    const filterStore = tx.objectStore("diagram_filters");

                    // Bersihkan record diagram lama secara sekuensial sebelum menulis record baru
                    const clearOld = (store, isDiag) => new Promise((res) => {
                        const curReq = store.openCursor();
                        curReq.onsuccess = function(ev) {
                            const cursor = ev.target.result;
                            if (cursor) {
                                const val = cursor.value;
                                const matchId = isDiag 
                                    ? (val.id === TARGET_DIAGRAM_ID || val.id === 1 || val.id === "1" || typeof val.id === "number") 
                                    : (val.diagramId === TARGET_DIAGRAM_ID || val.diagramId === 1 || val.diagramId === "1" || typeof val.diagramId === "number");
                                if (matchId) {
                                    cursor.delete();
                                }
                                cursor.continue();
                            } else {
                                res();
                            }
                        };
                        curReq.onerror = () => res();
                    });

                    await Promise.all([
                        clearOld(diagStore, true),
                        clearOld(tableStore, false),
                        clearOld(relStore, false)
                    ]);

                    // Buat Date native asli di JS
                    const diagData = Object.assign({}, PAYLOAD.diagram, {
                        createdAt: new Date(),
                        updatedAt: new Date()
                    });
                    diagStore.put(diagData);

                    for (const tbl of PAYLOAD.db_tables) {
                        tableStore.put(tbl);
                    }

                    for (const rel of PAYLOAD.db_relationships) {
                        relStore.put(rel);
                    }

                    confStore.put(PAYLOAD.config);
                    filterStore.put(PAYLOAD.diagram_filters);

                    tx.oncomplete = function() {
                        log("✅ Selesai! Berhasil menginjeksi " + PAYLOAD.db_tables.length + " tabel dan " + PAYLOAD.db_relationships.length + " relasi.");
                        log("🚀 Mengarahkan ke kanvas ChartDB...");
                        document.getElementById("title").textContent = "Injeksi Berhasil!";
                        document.getElementById("spinner").style.display = "none";
                        document.getElementById("open-btn").style.display = "inline-block";

                        setTimeout(() => {
                            window.location.replace('/diagrams/' + TARGET_DIAGRAM_ID);
                        }, 400);
                    };

                    tx.onerror = function(err) {
                        log("❌ Gagal menyimpan transaksi: " + err.target.error);
                        document.getElementById("spinner").style.display = "none";
                        document.getElementById("open-btn").style.display = "inline-block";
                    };
                };

                req.onerror = function(err) {
                    const error = err.target.error;
                    if (error && error.name === "VersionError") {
                        log("❌ VersionError: " + error.message + " (Versi IndexedDB tidak kompatibel)");
                    } else {
                        log("❌ Gagal membuka IndexedDB: " + (error ? error.message : err));
                    }
                    document.getElementById("spinner").style.display = "none";
                    document.getElementById("open-btn").style.display = "inline-block";
                };

            } catch (err) {
                log("⚠️ Terjadi error: " + err.message);
                document.getElementById("spinner").style.display = "none";
                document.getElementById("open-btn").style.display = "inline-block";
            }
        }

        window.addEventListener("DOMContentLoaded", () => seedChartDB(false, null));
    </script>
</body>
</html>
