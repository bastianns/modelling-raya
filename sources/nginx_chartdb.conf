# ==============================================================================
# Bank Raya - ChartDB Nginx Production Hardening & Anti-Disk-Cache Configuration
# Disables aggressive disk caching on HTML documents to guarantee instant auto-seeding
# ==============================================================================
server {
    listen       80;
    listen  [::]:80;

    # Explicit rule for autoload.html seeder
    location = /autoload.html {
        root   /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Root location with strict anti-caching for SPA entrypoints
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Explicit rule for all HTML files
    location ~* \.html$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Dynamic environment configuration
    location /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 "window.env = {
            OPENAI_API_KEY: \"\",
            OPENAI_API_ENDPOINT: \"\",
            LLM_MODEL_NAME: \"\",
            HIDE_CHARTDB_CLOUD: \"\",
            DISABLE_ANALYTICS: \"true\"
        };";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
